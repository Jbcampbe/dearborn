[package]
name = "dearborn-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "dearborn-server"
path = "src/main.rs"

# The agent-facing CLI (T-301): a thin authenticated REST client the breakdown
# agent shells out to. A separate binary so `cargo build` can put it on PATH
# beside `dearborn-server` (e.g. symlinked into the agent's PATH). See
# `src/cli.rs` for the client and `src/bin/dearborn.rs` for argv wiring.
[[bin]]
name = "dearborn"
path = "src/bin/dearborn.rs"

[lib]
name = "dearborn_server"
path = "src/lib.rs"

[dependencies]
tokio = { workspace = true }
axum = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
libsql = { workspace = true }
ulid = { workspace = true }
agent-harness = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
futures-util = { workspace = true }
aes-gcm = { workspace = true }
argon2 = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }
hmac = { workspace = true }
subtle = { workspace = true }
reqwest = { workspace = true }
libc = { workspace = true }

[dev-dependencies]
tower = { workspace = true }
tokio-tungstenite = { workspace = true }
reqwest = { workspace = true }
