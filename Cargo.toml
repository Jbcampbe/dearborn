[workspace]
resolver = "2"
members = ["dearborn-server"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["ws"] }
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
tokio-tungstenite = "0.24"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
libsql = { version = "0.9", default-features = false, features = ["core"] }
ulid = "1"
# Agent runtime — shells out to Claude Code. Pinned exact (pre-1.0, churny;
# imported as `harness`). See docs/spikes/T-200-agent-harness.md.
agent-harness = "=0.3.5"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["trace", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
aes-gcm = "0.10"
# Argon2id password hashing (RustCrypto, same family as aes-gcm/sha2 — pure
# Rust, no C toolchain). Stores the PHC string so cost parameters travel with
# each hash. See dearborn-server/src/users.rs.
argon2 = "0.5"
sha2 = "0.10"
base64 = "0.22"
# HMAC-SHA256 for the signed access-token codec (auth.rs). Already present
# transitively, so no new crate enters the tree.
hmac = "0.12"
# Constant-time byte comparison for MAC verification in auth.rs. Also already
# present transitively (via argon2/aes-gcm).
subtle = "2"
# GitHub API client for T-514's GitHost (push + PR). rustls (not native-tls /
# OpenSSL) per D15 — see MILESTONE_2 §14 and dearborn-server/src/git_host.rs.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
# Direct `libc::kill` for T-520's process-group kill (SIGTERM/SIGKILL on a
# negative pid). Already present transitively (via tokio) at 0.2.186, so this
# adds a direct dependency without introducing a new version into the tree.
libc = "0.2"
